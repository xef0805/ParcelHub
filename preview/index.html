<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1761dd"><title>涂涂取件</title><link rel="icon" href="/preview/assets/tutu.png"><link rel="stylesheet" href="/preview/style.css"><script type="module" src="/preview/app.mjs"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#packages"><img src="/preview/assets/tutu.png" alt=""><span>涂涂取件<small>TUTU PICKUP</small></span></a><nav aria-label="主导航"><button data-page="packages" class="active">▣ <span>待取件</span></button><button data-page="providers">▥ <span>身份码</span></button><button data-page="my">◉ <span>我的</span></button></nav><p class="sidebar-note">不怕忘记，顺路取齐。<br>包裹记录仅保存在本机</p></aside>
<main><div class="preview-notice" id="preview-notice">Windows 本地预览 · iPhone 自动刷新需安装后验证</div><div class="warning" id="warning" hidden></div>
<section id="page-packages" class="page"><header><div><p class="eyebrow">EVERY PARCEL, ONE PLACE</p><h1>涂涂取件</h1></div></header>
<label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索包裹、取件码或地点" aria-label="搜索包裹、取件码或地点"></label>
<div class="home-summary"><div class="home-count"><div><strong id="pending-count">0</strong><span>件待取包裹</span></div><small><span id="station-count">0</span> 个取件地点</small></div><button class="button import-home" id="add-parcel"><span>＋</span>手动导入包裹</button></div>
<div class="sync-line"><span id="sync-status">本机快照，等待读取</span><button class="text-button" id="refresh-snapshot" aria-label="刷新待取清单">↻ 刷新</button></div>
<h2 class="section-title">待取清单</h2><div id="parcel-list"></div></section>
<section id="page-providers" class="page" hidden><header><div><p class="eyebrow">YOUR PICKUP PASSES</p><h1>身份码</h1></div></header><p class="hint">四个官方入口分别绑定；短信包裹可直接展示保存的通知原文。</p><div id="provider-grid" class="provider-grid"></div><div class="provider-actions"><span class="hint">按驿站要求选择凭证</span><button class="text-button" id="sort-providers">排序</button></div></section>
<section id="page-my" class="page" hidden><header><div><p class="eyebrow">A LITTLE MORE ORGANIZED</p><h1>我的</h1></div></header><div class="profile-card"><img src="/preview/assets/tutu.png" alt="涂涂取件 logo"><div><h2>涂涂取件</h2><p>把每一次取件整理好</p></div></div><div class="menu-card"><button id="show-collected"><span>✓ 已取记录</span><span><b id="collected-count">0</b> ›</span></button><button id="show-settings"><span>⚙ 设置</span><span>›</span></button></div><p class="hint">更多个人功能会逐步加入。</p><div id="history-panel" hidden><h2 class="section-title">已取记录</h2><label class="search history-search"><span>⌕</span><input id="history-search" type="search" placeholder="搜索包裹、取件码或地点" aria-label="搜索已取记录"></label><div id="collected-list"></div></div></section>
<footer>涂涂取件 0.6.0 · 本地开发预览</footer></main>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status" hidden></div></body></html>
